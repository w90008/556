    <style>

:root{
  --bg:#05080e;--panel:rgba(11,18,29,.84);--line:rgba(83,205,255,.22);
  --text:#f2f8ff;--muted:#8fa4b8;--cyan:#57d9ff;--green:#73e3a0;
  --red:#ff7474;--gold:#ffd166;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#03060b;
  color:var(--text);
  font:15px/1.45 "Segoe UI",system-ui,sans-serif;
}

/* غيّر اسم الصورة من هذا السطر فقط */
body{
  background-image:url("background.jpg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* طبقة خفيفة فوق الصورة */
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(3,6,11,.38);
  z-index:-1;
  pointer-events:none;
}

#brand{
  position:relative;
  text-align:center;
  padding:18px 12px;
  background:linear-gradient(
    180deg,
    rgba(10,23,38,.88),
    rgba(5,11,19,.78)
  );
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 35px rgba(0,0,0,.25);
}

/* تم حذف الخط العلوي */

#brand b{
  font-size:20px;
  font-weight:800;
  letter-spacing:.08em;
  color:#fff;
  text-shadow:0 0 16px rgba(87,217,255,.45);
}

#spin{
  position:fixed;
  top:50%;
  left:50%;
  width:58px;
  height:58px;
  margin:-29px 0 0 -29px;
  border:4px solid rgba(87,217,255,.13);
  border-top-color:var(--cyan);
  border-right-color:rgba(87,217,255,.55);
  border-radius:50%;
  animation:spin .85s linear infinite;
  box-shadow:0 0 28px rgba(87,217,255,.18);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#msg{
  position:fixed;
  top:50%;
  left:50%;
  right:auto;
  transform:translate(-50%,-50%);
  min-width:min(430px,calc(100% - 34px));
  padding:24px 28px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  letter-spacing:.3px;
  color:#fff;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:
    0 20px 70px rgba(0,0,0,.5),
    0 0 30px rgba(87,217,255,.08);
  backdrop-filter:blur(12px);
  display:none;
}

#msg:before{
  content:"PS4  •  ";
  color:var(--cyan);
}

#wrap{
  padding:0;
  max-width:1100px;
  margin:0 auto;
  width:100%;
}

#state,#out{
  display:none;
}

body.done #spin,
body.fail #spin{
  display:none;
}

body.fail #msg{
  display:block;
}

body.log #spin,
body.log #msg{
  display:none;
}

body.log #wrap{
  padding:24px 20px;
}

body.log #state{
  display:block;
  max-width:1100px;
  margin:0 auto 14px;
  padding:18px 20px;
  font-size:25px;
  font-weight:800;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}

body.log #state:before{
  content:"PS4  •  ";
  color:var(--cyan);
  font-size:.65em;
}

body.log #out{
  display:block;
  white-space:pre-wrap;
  font:12px/1.55 Consolas,monospace;
  color:#cfe5f5;
  background:rgba(4,9,16,.92);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  height:calc(100vh - 150px);
  overflow-y:auto;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 15px 45px rgba(0,0,0,.3);
}

.ok{color:var(--green)}
.bad{color:var(--red)}
.warn{color:var(--gold)}
.safe{color:var(--green)}
.danger{color:var(--red)}
code{color:#9edaff}

@media(max-width:600px){

  #brand b{
    font-size:16px;
    letter-spacing:.04em;
  }

  body.log #wrap{
    padding:14px 10px;
  }

  body.log #state{
    font-size:20px;
  }

  body.log #out{
    font-size:11px;
    padding:12px;
  }

}
